<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quero fazer parte | Aviva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/members.css">
</head>
<body data-page="member-register">
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand-row">
        <span class="brand-icon"><img class="brand-logo" src="/assets/logo.png" alt=""></span>
        <strong>Ministério Aviva</strong>
      </div>
      <p class="eyebrow">Membros</p>
      <h1>Quero fazer parte do Aviva</h1>
      <p>Preencha o formulário para se aproximar do ministério. A equipe entra em contato depois.</p>

      <form class="form-grid" data-member-interest>
        <label>
          Nome
          <input name="name" autocomplete="name" required minlength="2" placeholder="Seu nome">
        </label>
        <label>
          E-mail
          <input name="email" type="email" autocomplete="email" required placeholder="voce@email.com">
        </label>
        <label>
          WhatsApp
          <input name="phone" type="tel" autocomplete="tel" required placeholder="(11) 99999-9999">
        </label>
        <label>
          Paróquia ou comunidade
          <input name="community" autocomplete="organization" placeholder="Onde voce participa?">
        </label>
        <label>
          Mensagem
          <textarea name="message" placeholder="Conte um pouco sobre voce e como quer participar"></textarea>
        </label>
        <button class="btn btn-primary" type="submit">Enviar interesse</button>
      </form>
      <p class="message" role="status"></p>
      <div class="auth-links">
        <a href="/community/">Ja tenho conta</a>
        <a href="/index.html">Voltar ao site</a>
      </div>
    </section>
  </main>
  <script src="/shared/app.js"></script>
</body>
</html>
